services:
  - type: web
    name: raymidi-voice-relay
    runtime: node
    plan: free
    rootDir: voice-relay
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CORS_ORIGIN
        value: https://www.raymidi.com
      # Google Cloud STT uses Application Default Credentials (ADC).
      # On Render, set GOOGLE_APPLICATION_CREDENTIALS to the path of
      # a service account key JSON file, or use Render's GCP integration.
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false
